# Автоматическое дублирование данных с Google Диска на сайт.
# Каждые 30 минут скачивает документы, пересобирает data/ и карты, коммитит изменения.
# Запуск вручную: вкладка Actions → «Синхронизация с Google Диском» → Run workflow.
name: Синхронизация с Google Диском

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/manual.json", "tools/sync_drive.py"]

permissions:
  contents: write

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Зависимости
        run: pip install python-docx==1.2.0 pillow==12.3.0

      - name: Синхронизация
        run: python tools/sync_drive.py

      - name: Сохранить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Синхронизация с Google Диском"
            git pull --rebase
            git push
          fi
